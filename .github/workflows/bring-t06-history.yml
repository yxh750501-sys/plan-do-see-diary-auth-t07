name: Bring T06 submission history
on:
  push:
    branches: [main]
    paths: [.github/workflows/bring-t06-history.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch fixed T06 commit into this repository
        shell: bash
        run: |
          git remote add t06 https://github.com/yxh750501-sys/plan-do-see-diary-t06.git
          git fetch t06 main
          test "$(git rev-parse FETCH_HEAD)" = "88778c3f9b3d20880c5a2d428abfe01b481eebf5"
          git push origin FETCH_HEAD:refs/heads/t06-base
